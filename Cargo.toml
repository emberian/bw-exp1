[workspace]
resolver = "2"
members = [
    "crates/bw-core",
    "crates/bw-game",
    "crates/bw-ai",
    "crates/bw-shared",
    "crates/bw-scripting",
    "crates/bw-scripting-macros",
    "crates/bw-server",
    "crates/bw-frontend",
    "crates/bw-gm-editor",
    "crates/bw-tui",
    "crates/bw-export",
    "crates/bw-export-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Blackwing Team"]

[workspace.dependencies]
# Core
uuid = { version = "1.19", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Scripting
rhai = { version = "1.23", features = ["sync", "serde", "debugging", "internals"] }

# Web server
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Database
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "with-uuid", "with-chrono", "with-json"] }

# Authentication
argon2 = "0.5"
sha2 = "0.10"
base64 = "0.22"

# WebSocket / Serialization
tokio-tungstenite = "0.24"
rmp-serde = "1.3"  # MessagePack

# Concurrency
dashmap = "6.1"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Leptos
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }

# Utils
rand = "0.8"
dotenvy = "0.15"
toml = "0.8"
derivative = "2.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
