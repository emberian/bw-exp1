# fly.toml - Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "bw-exp1"
primary_region = "sjc"

[build]
dockerfile = "Dockerfile"

[env]
RUST_LOG = "bw_server=info,tower_http=info"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[mounts]
source = "blackwing_data"
destination = "/app/data"

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
