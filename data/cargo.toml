# Cargo Types
#
# Defines tradeable goods, their base prices, and properties.
# Scripts use get_cargo_def(cargo_type) to load these.

# ============================================================================
# Common Goods - Low value, low risk
# ============================================================================

[fuel_cells]
name = "Fuel Cells"
description = "Standard ship fuel. Always in demand."
base_price = 10
weight = 1
legal = true
volatility = 0.1

[water]
name = "Purified Water"
description = "Essential for life support and industrial processes."
base_price = 5
weight = 2
legal = true
volatility = 0.05

[food_supplies]
name = "Food Supplies"
description = "Preserved rations for long voyages."
base_price = 15
weight = 1
legal = true
volatility = 0.15

[medical_supplies]
name = "Medical Supplies"
description = "First aid kits and basic pharmaceuticals."
base_price = 50
weight = 1
legal = true
volatility = 0.2

