# Ship Upgrades
#
# Defines purchasable ship modifications.
# Scripts use get_upgrade_def(upgrade_id) to load these.

# ============================================================================
# Weapon Upgrades
# ============================================================================

[railgun_mk2]
name = "Railgun Mk2"
description = "Enhanced railgun with improved accuracy and damage."
slot_type = "weapon"
tier = 2
reputation_cost = 100
credits_cost = 1000
effects = { attack_bonus = 10, accuracy_bonus = 0.05 }
requires = { min_ship_tier = 2 }

[railgun_mk3]
name = "Railgun Mk3"
description = "Military-grade railgun with exceptional accuracy."
slot_type = "weapon"
tier = 3
reputation_cost = 250
credits_cost = 3000
effects = { attack_bonus = 20, accuracy_bonus = 0.10 }
requires = { min_ship_tier = 3 }

[missile_pods]
